<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Gramophone · Entrance study</title><link rel="stylesheet" href="style.css"><script src="animation.js" defer></script></head>
<body>
<main>

<ellipse cx="600" cy="1145" rx="380" ry="34" fill="url(#ground-shadow)"/>

<g data-part="cabinet"><image href="assets-redesigned/body.svg" x="353" y="628" width="425" height="328"/></g>

<nav aria-label="Motion controls">
<button type="button" class="primary" data-action="full">Play Full Sequence <span aria-hidden="true">↗</span></button>
<button type="button" data-action="reset">Reset</button>
<div class="divider" aria-hidden="true"></div>
<button type="button" data-action="walk">Walk</button><button type="button" data-action="sit">Sit</button><button type="button" data-action="pull">Pull Disc</button>
</nav>
<footer><span>Walk → settle → sit → pocket → hold</span><span>No sound. No game logic. Just movement.</span></footer>
</main>
